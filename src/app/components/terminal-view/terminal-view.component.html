<div class="terminal-container" (click)="onTerminalClick()">
  <div class="terminal-header">
    <div class="terminal-buttons">
      <span class="button close" (click)="closeTerminal($event)" title="Close"></span>
      <span class="button minimize" (click)="minimizeTerminal($event)" title="Minimize"></span>
      <span class="button maximize" (click)="maximizeTerminal($event)" title="Maximize"></span>
    </div>
    <div class="terminal-title">wout@portfolio:~</div>
  </div>

  <div class="terminal-body" #terminalContent>
    <div class="terminal-content">
      <!-- Rickroll video embed -->
      <div *ngIf="showRickroll" class="video-container">
        <iframe
          width="100%"
          height="315"
          src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"
          title="YouTube video player"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

      <div *ngFor="let line of lines"
           class="terminal-line"
           [ngClass]="line.type">
        {{ line.displayText || line.text }}<span *ngIf="line.isTyping" class="typing-cursor">▊</span>
      </div>
      <div class="terminal-line command input-line" *ngIf="!isTyping">
        <span class="prompt" *ngIf="!awaitingSudoPassword">></span>
        <span class="sudo-prompt" *ngIf="awaitingSudoPassword">[sudo] password for {{ personalInfo?.firstName?.toLowerCase() || 'user' }}: </span>
        <input
          #terminalInput
          [type]="awaitingSudoPassword ? 'password' : 'text'"
          class="terminal-input"
          [(ngModel)]="currentInput"
          (keydown)="handleKeyDown($event)"
          autocomplete="off"
          spellcheck="false"
        />
        <span class="cursor" [class.hidden]="currentInput.length > 0 || awaitingSudoPassword">_</span>
      </div>
    </div>
  </div>
</div>
